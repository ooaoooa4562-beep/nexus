name: NEXUS Uptime Checks
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due website checks
        env:
          MONITOR_CRON_SECRET: ${{ secrets.MONITOR_CRON_SECRET }}
        run: |
          if [ -z "$MONITOR_CRON_SECRET" ]; then
            echo "MONITOR_CRON_SECRET is not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors --max-time 60 \
            -X POST \
            -H "x-monitor-secret: $MONITOR_CRON_SECRET" \
            https://nexus-github-api.onrender.com/api/monitor/cron
